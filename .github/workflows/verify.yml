name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks-bin"
          scanner_archive="$RUNNER_TEMP/gitleaks.tar.gz"
          mkdir -p "$scanner_dir"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_archive" | sha256sum --check -
          tar -xzf "$scanner_archive" -C "$scanner_dir" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Install
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Publication preflight
        run: npm run preflight
